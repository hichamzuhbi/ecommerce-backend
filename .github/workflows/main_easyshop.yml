name: Build and Deploy NestJS App to Azure Web App - easyshop

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-deployment
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build NestJS project
        run: npm run build

      - name: Prepare deployment package
        run: |
          cp package*.json dist/
          cd dist
          npm install --omit=dev --legacy-peer-deps

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_70C4F8D7799C414E8D002219FD767595 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BB899E4CEF22485DB0A3677CB10C3160 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CE90D966DD36418EAEF00613E1F732FF }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'easyshop'
          slot-name: 'Production'
          package: .